      /* ============================================================
       * LIVE COUNTDOWN TIMERS
       * ============================================================ */
      let _gateCountdownInterval = null;

      function startGateCountdown(targetTimestamp) {
        if (_gateCountdownInterval) {
          clearInterval(_gateCountdownInterval);
          _gateCountdownInterval = null;
        }
        if (!targetTimestamp) return;

        var target = Number(targetTimestamp);
        if (!target || isNaN(target)) return;

        function update() {
          var elDays = document.getElementById("cdDays");
          if (!elDays) {
            if (_gateCountdownInterval) {
              clearInterval(_gateCountdownInterval);
              _gateCountdownInterval = null;
            }
            return;
          }

          var now = Date.now();
          var diff = target - now;

          if (diff <= 0) {
            document.getElementById("cdDays").textContent = "0";
            document.getElementById("cdHours").textContent = "0";
            document.getElementById("cdMinutes").textContent = "0";
            document.getElementById("cdSeconds").textContent = "0";
            if (_gateCountdownInterval) {
              clearInterval(_gateCountdownInterval);
              _gateCountdownInterval = null;
            }
            // Auto-refresh to scanning mode
            setTimeout(async function () {
              await loadGateDashboard();
              renderApp();
            }, 1500);
            return;
          }

          var days = Math.floor(diff / (1000 * 60 * 60 * 24));
          var hours = Math.floor(
            (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
          );
          var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          var seconds = Math.floor((diff % (1000 * 60)) / 1000);

          var dEl = document.getElementById("cdDays");
          var hEl = document.getElementById("cdHours");
          var mEl = document.getElementById("cdMinutes");
          var sEl = document.getElementById("cdSeconds");
          if (dEl) dEl.textContent = formatNumber(String(days));
          if (hEl)
            hEl.textContent = formatNumber(String(hours).padStart(2, "0"));
          if (mEl)
            mEl.textContent = formatNumber(String(minutes).padStart(2, "0"));
          if (sEl)
            sEl.textContent = formatNumber(String(seconds).padStart(2, "0"));
        }

        update();
        _gateCountdownInterval = setInterval(update, 1000);
      }

      /* ============================================================
       * QR SCANNER (Camera + 5s Cycle)
       * ============================================================ */
      const SCAN_CYCLE_SECONDS = 5;

      async function toggleCamera() {
        if (State.cameraStream) {
          stopCamera();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment",
              width: { ideal: 640 },
              height: { ideal: 480 },
            },
          });
          State.cameraStream = stream;
          const video = document.getElementById("qrVideo");
          const placeholder = document.getElementById("qrPlaceholder");
          const line = document.getElementById("scannerLine");
          const timer = document.getElementById("scannerTimer");
          const btn = document.getElementById("cameraBtn");
          if (video) {
            video.srcObject = stream;
            video.style.display = "block";
            video.play();
          }
          if (placeholder) placeholder.style.display = "none";
          if (line) line.style.display = "block";
          if (timer) timer.style.display = "flex";
          if (btn)
            btn.innerHTML = `<i class="fas fa-stop mr-2"></i>${t("stopCamera")}`;
          startScanCycle();
        } catch (e) {
          console.error("Camera error:", e);
          showToast("Camera not available: " + e.message, "error");
        }
      }

      function stopCamera() {
        if (State.scanCycleTimer) {
          clearInterval(State.scanCycleTimer);
          State.scanCycleTimer = null;
        }
        if (State.scanFrameTimer) {
          clearInterval(State.scanFrameTimer);
          State.scanFrameTimer = null;
        }

        if (State.cameraStream) {
          State.cameraStream.getTracks().forEach((tr) => tr.stop());
          State.cameraStream = null;
        }

        const video = document.getElementById("qrVideo");
        const placeholder = document.getElementById("qrPlaceholder");
        const line = document.getElementById("scannerLine");
        const timer = document.getElementById("scannerTimer");
        const btn = document.getElementById("cameraBtn");
        if (video) {
          video.srcObject = null;
          video.style.display = "none";
        }
        if (placeholder) placeholder.style.display = "flex";
        if (line) line.style.display = "none";
        if (timer) timer.style.display = "none";
        if (btn)
          btn.innerHTML = `<i class="fas fa-camera mr-2"></i>${t("startCamera")}`;
      }

      // 5-second scan cycle: line sweeps, timer counts down, QR detected → stop
      function startScanCycle() {
        if (State.scanCycleTimer) {
          clearInterval(State.scanCycleTimer);
          State.scanCycleTimer = null;
        }
        if (State.scanFrameTimer) {
          clearInterval(State.scanFrameTimer);
          State.scanFrameTimer = null;
        }

        if (typeof jsQR === "undefined") {
          console.warn("jsQR not loaded — camera scanning disabled");
          return;
        }

        const line = document.getElementById("scannerLine");
        if (line) {
          line.classList.remove("paused");
          line.style.display = "block";
          line.style.animation = "none";
          void line.offsetWidth;
          line.style.animation = "scanLine 2.5s ease-in-out infinite";
        }

        let secondsLeft = SCAN_CYCLE_SECONDS;
        updateTimerDisplay(secondsLeft);

        State.scanCycleTimer = setInterval(function () {
          secondsLeft--;
          updateTimerDisplay(secondsLeft);

          if (secondsLeft <= 0) {
            clearInterval(State.scanCycleTimer);
            State.scanCycleTimer = null;
            if (State.scanFrameTimer) {
              clearInterval(State.scanFrameTimer);
              State.scanFrameTimer = null;
            }
            if (State.cameraStream) {
              startScanCycle();
            }
          }
        }, 1000);

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        State.scanFrameTimer = setInterval(function () {
          const video = document.getElementById("qrVideo");
          if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
          if (!State.cameraStream) return;

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0);

          try {
            const imageData = ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height,
            );
            const code = jsQR(
              imageData.data,
              imageData.width,
              imageData.height,
              { inversionAttempts: "dontInvert" },
            );
            if (code && code.data) {
              handleQrDetected(code.data);
            }
          } catch (e) {}
        }, 250);
      }

      // Called when a QR is detected in the scan cycle
      function handleQrDetected(qrData) {
        if (State.scanCycleTimer) {
          clearInterval(State.scanCycleTimer);
          State.scanCycleTimer = null;
        }
        if (State.scanFrameTimer) {
          clearInterval(State.scanFrameTimer);
          State.scanFrameTimer = null;
        }

        const line = document.getElementById("scannerLine");
        if (line) line.classList.add("paused");
        const timer = document.getElementById("scannerTimer");
        if (timer) timer.style.display = "none";

        const container = document.getElementById("scannerContainer");
        if (container) {
          container.classList.add("success");
          setTimeout(function () {
            container.classList.remove("success");
          }, 1000);
        }

        // Beep
        try {
          const audioCtx = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = 1200;
          gain.gain.value = 0.15;
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}

        // Extract Registration ID (accept full URL or raw)
        let regId = qrData;
        const m = qrData.match(/verify=([A-Z0-9]+)/i);
        if (m) regId = m[1];

        processScan(regId);
      }

      function updateTimerDisplay(seconds) {
        const el = document.getElementById("scannerTimerText");
        if (el) el.textContent = seconds + "s";
      }

      function pauseScanCycle() {
        if (State.scanCycleTimer) {
          clearInterval(State.scanCycleTimer);
          State.scanCycleTimer = null;
        }
        if (State.scanFrameTimer) {
          clearInterval(State.scanFrameTimer);
          State.scanFrameTimer = null;
        }
        const line = document.getElementById("scannerLine");
        if (line) line.classList.add("paused");
        const timer = document.getElementById("scannerTimer");
        if (timer) timer.style.display = "none";
      }

      function resumeScanCycle() {
        if (!State.cameraStream) return;
        const line = document.getElementById("scannerLine");
        if (line) line.classList.remove("paused");
        const timer = document.getElementById("scannerTimer");
        if (timer) timer.style.display = "flex";
        startScanCycle();
      }

        input.value = "";

      function filterRegistrations() {
        const q = (
          (document.getElementById("regSearch") &&
            document.getElementById("regSearch").value) ||
          ""
        )
          .toLowerCase()
          .trim();
        const status =
          (document.getElementById("regStatusFilter") &&
            document.getElementById("regStatusFilter").value) ||
          "";
        const rows = document.querySelectorAll(
          "#registrationsTableBody tr[data-reg]",
        );
        rows.forEach((row) => {
          const text = row.getAttribute("data-search") || "";
          const rowStatus = row.getAttribute("data-status") || "";
          const matchQ = !q || text.indexOf(q) !== -1;
          const matchS = !status || rowStatus === status;
          row.style.display = matchQ && matchS ? "" : "none";
        });
      }
      const filterRegistrationsDebounced = debounce(filterRegistrations, 200);

      /* ============================================================
       * DELETE REGISTRATION
       * ============================================================ */

        var reg = null;
        for (var i = 0; i < (State.registrations || []).length; i++) {
          if (State.registrations[i].Registration_ID === regId) {
            reg = State.registrations[i];
            break;
          }
        }
        if (!reg) return;
        var existing = document.getElementById("deleteRegistrationModal");
        if (existing) existing.remove();
        var modal = document.createElement("div");
        modal.className =
          "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4";
        modal.id = "deleteRegistrationModal";
        modal.innerHTML = `
        <div class="bg-white rounded-2xl max-w-md w-full max-h-screen overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg"><i class="fas fa-exclamation-triangle text-red-600 mr-2"></i>Delete Registration</h3><button onclick="closeModal('deleteRegistrationModal')" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times"></i></button></div>
                <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4 text-sm">
                    <p class="mb-2"><b>Are you sure you want to delete this registration?</b></p>
                    <div class="space-y-1 text-xs">
                        <p><span class="text-gray-600">Registration ID:</span> <b>${reg.Registration_ID || "-"}</b></p>
                        <p><span class="text-gray-600">Student Name:</span> ${reg.Student_Name || "-"}</p>

                </div>

                    <p class="font-bold mb-2">What will happen:</p>
                    <ul class="space-y-1"><li>✓ Registration data will be removed</li><li>✓ Student's basic info will remain</li><li>✓ Student can register again</li></ul>

                    <div><label class="form-label">Reason (optional)</label><textarea id="deleteReason" class="form-input" rows="2" placeholder="Why are you deleting this?"></textarea></div>

                    </div>
                </div>
            </div>
        </div>`;
        document.body.appendChild(modal);
      }

      async function submitDeleteRegistration(regId) {
        var reason =
          (document.getElementById("deleteReason") &&
            document.getElementById("deleteReason").value.trim()) ||
          "";
        var btn = document.getElementById("deleteRegBtn");
        var original = btn.innerHTML;
        btn.innerHTML = `<span class="spinner mr-2"></span>Deleting...`;
        btn.disabled = true;
        var result = await apiCall("deleteRegistration", {
          registrationId: regId,
          reason: reason,
        });
        btn.innerHTML = original;
        btn.disabled = false;
        if (result) {
          showToast("Registration deleted successfully", "success");
          closeModal("deleteRegistrationModal");
          closeModal("detailsModal");
          await loadDashboardData();
          renderApp();
        }
      }

      /* ============================================================
       * ADMINS TAB
       * ============================================================ */
      function renderAdmins() {
        const allAdmins = State.admins || [];
        const filterQuery = (State.adminsSearchQuery || "").trim();
        const filteredAdmins = filterQuery
          ? allAdmins.filter(function (a) {
              const batch = String(a.Assigned_Batch || "").replace(/^'/, "");
              return batch.indexOf(filterQuery) !== -1;
            })
          : allAdmins;
        const perPage = State.adminsPerPage || 5;
        const total = filteredAdmins.length;
        const maxPage = Math.max(1, Math.ceil(total / perPage));
        let page = State.adminsPage || 1;
        if (page > maxPage) page = maxPage;
        if (page < 1) page = 1;
        const start = (page - 1) * perPage;
        const end = start + perPage;
        const paginatedAdmins = filteredAdmins.slice(start, end);

        return `
  <div class="card p-4">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
          <h3 class="font-bold text-gray-800 whitespace-nowrap">${t("batch_gateAdmin")}</h3>
          <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
              <input type="text" id="adminSearch" class="form-input" maxlength="4" inputmode="numeric" placeholder="${State.language === "bn" ? "ব্যাচ সাল" : "Batch Year"}" value="${filterQuery}" oninput="onAdminSearchInput(event)">

              <button onclick="showCreateGateAdminModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium whitespace-nowrap"><i class="fas fa-door-open mr-1"></i>${t("createGateAdmin")}</button>
          </div>
      </div>
      <div class="table-responsive">
          <table id="adminsTable" class="w-full text-sm data-table">
              <thead><tr class="bg-gray-50">
                  <th class="px-3 py-2 text-left">${t("name")}</th>
                  <th class="px-3 py-2 text-left">${t("adminId")}</th>
                  <th class="px-3 py-2 text-left">${t("batch")}</th>
                  <th class="px-3 py-2 text-left">${t("status")}</th>
                  <th class="px-3 py-2 text-left">${t("actions")}</th>

              <tbody>
                  ${
                    paginatedAdmins.length === 0
                      ? `<tr><td colspan="5" class="px-3 py-8 text-center text-gray-500"><p>${t("noAdmins")}</p></td></tr>`

                          .map((a) => {
                            const roleLabel =
                              a.Role === "GATE_ADMIN"
                                ? '<span class="px-2 py-1 rounded-full text-xs font-medium bg-indigo-100 text-indigo-700">Gate</span>'
                                : formatNumber(
                                    String(a.Assigned_Batch || "").replace(
                                      /^'/,
                                      "",
                                    ),
                                  );
                            return `
                      <tr class="border-b border-gray-100 hover:bg-gray-50">
                          <td class="px-3 py-3 font-medium">${a.Name || "-"}</td>
                          <td class="px-3 py-3">${a.Username || "-"}</td>
                          <td class="px-3 py-3">${roleLabel}</td>
                          <td class="px-3 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${a.Status === "Active" ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-600"}">${a.Status}</span></td>
                          <td class="px-3 py-3">
                              <div class="flex gap-2">
                                  <button onclick="showResetPasswordModal('${a.Admin_ID}')" class="w-8 h-8 flex items-center justify-center bg-yellow-100 text-yellow-700 rounded-lg hover:bg-yellow-200" title="${t("resetPassword")}"><i class="fas fa-key"></i></button>
                                  <button onclick="showEditAdminModal('${a.Admin_ID}')" class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200" title="${t("editAdminTitle")}"><i class="fas fa-pen"></i></button>
                                  <button onclick="toggleAdminStatus('${a.Admin_ID}')" class="w-8 h-8 flex items-center justify-center ${a.Status === "Active" ? "bg-green-100 text-green-700 hover:bg-green-200" : "bg-red-100 text-red-700 hover:bg-red-200"} rounded-lg" title="${a.Status === "Active" ? t("toggleInactive") : t("toggleActive")}"><i class="fas ${a.Status === "Active" ? "fa-toggle-on" : "fa-toggle-off"}"></i></button>
                              </div>
                          </td>
                      </tr>`;
                          })
                          .join("")
                  }
              </tbody>
          </table>
      </div>
      <div class="text-sm text-gray-500 mt-3 text-center">Showing ${total === 0 ? 0 : start + 1}-${Math.min(end, total)} of ${total}</div>
      ${renderAdminsPagination(page, maxPage)}

      function onAdminSearchInput(event) {
        let v = event.target.value.replace(/\D/g, "").slice(0, 4);
        event.target.value = v;
        State.adminsSearchQuery = v;
        State.adminsPage = 1;
        const admin = State.adminData || {};
        if (admin.Role !== "SUPER_ADMIN") return;
        renderApp();
        setTimeout(function () {
          const el = document.getElementById("adminSearch");
          if (el) {
            el.focus();
            const len = el.value.length;
            el.setSelectionRange(len, len);
          }
        }, 0);
      }

      function renderAdminsPagination(currentPage, totalPages) {
        if (totalPages <= 1) return "";
        var buttons = [];
        buttons.push(
          `<button onclick="goToAdminsPage(${currentPage - 1})" class="px-3 py-1 rounded-lg text-sm ${currentPage === 1 ? "bg-gray-100 text-gray-400 cursor-not-allowed" : "bg-gray-100 hover:bg-gray-200 text-gray-700"}" ${currentPage === 1 ? "disabled" : ""}><i class="fas fa-chevron-left"></i></button>`,
        );
        var pages = [];
        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, currentPage + 2);
        if (startPage > 1) {
          pages.push(1);
          if (startPage > 2) pages.push("...");
        }
        for (var i = startPage; i <= endPage; i++) pages.push(i);
        if (endPage < totalPages) {
          if (endPage < totalPages - 1) pages.push("...");
          pages.push(totalPages);
        }
        pages.forEach(function (p) {
          if (p === "...")
            buttons.push(`<span class="px-2 text-gray-400">...</span>`);
          else {
            var active = p === currentPage;
            buttons.push(
              `<button onclick="goToAdminsPage(${p})" class="px-3 py-1 rounded-lg text-sm ${active ? "bg-purple-600 text-white font-bold" : "bg-gray-100 hover:bg-gray-200 text-gray-700"}">${p}</button>`,
            );
          }
        });
        buttons.push(
          `<button onclick="goToAdminsPage(${currentPage + 1})" class="px-3 py-1 rounded-lg text-sm ${currentPage === totalPages ? "bg-gray-100 text-gray-400 cursor-not-allowed" : "bg-gray-100 hover:bg-gray-200 text-gray-700"}" ${currentPage === totalPages ? "disabled" : ""}><i class="fas fa-chevron-right"></i></button>`,
        );
        return `<div class="flex flex-wrap items-center justify-center gap-2 mt-4 pt-4 border-t border-gray-200">${buttons.join("")}</div>`;
      }

      function goToAdminsPage(page) {
        State.adminsPage = page;
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

        modal.className =
          "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4";
        modal.id = "editAdminModal";
        modal.innerHTML = `
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-screen overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg"><i class="fas fa-pen text-blue-600 mr-2"></i>${t("editAdminTitle")}</h3><button onclick="closeModal('editAdminModal')" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times"></i></button></div>
                <div class="grid grid-cols-3 gap-3">
                    <div><label class="form-label">${t("roleLabels")}</label><input type="text" class="form-input bg-gray-100 cursor-not-allowed" value="${admin.Role}" disabled readonly></div>
                    <div><label class="form-label">${t("name")} <span class="text-red-500">*</span></label><input type="text" id="editAdminName" class="form-input" maxlength="100" value="${admin.Name || ""}"></div>
                    <div><label class="form-label">${t("adminId")} <span class="text-red-500">*</span></label><input type="text" id="editAdminUsername" class="form-input" maxlength="30" autocomplete="off" value="${admin.Username || ""}"></div>
                    ${

                    <div><label class="form-label">${t("bKashNumberLabel")}</label><input type="text" id="editAdminBkash" class="form-input" maxlength="11" inputmode="numeric" placeholder="01XXXXXXXXX" value="${admin.Bkash_Number || ""}" oninput="onNumericInput(event, 11)"></div>
                    <div><label class="form-label">${t("nagadNumberLabel")}</label><input type="text" id="editAdminNagad" class="form-input" maxlength="11" inputmode="numeric" placeholder="01XXXXXXXXX" value="${admin.Nagad_Number || ""}" oninput="onNumericInput(event, 11)"></div>
                    <div><label class="form-label">${t("rocketNumberLabel")}</label><input type="text" id="editAdminRocket" class="form-input" maxlength="11" inputmode="numeric" placeholder="01XXXXXXXXX" value="${admin.Rocket_Number || ""}" oninput="onNumericInput(event, 11)"></div>
                    `
                        : ""
                    }
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="closeModal('editAdminModal')" class="flex-1 py-3 btn-secondary rounded-xl font-medium">${t("cancel")}</button>
                    <button onclick="submitEditAdmin('${adminId}')" id="editAdminBtn" class="flex-1 py-3 btn-primary rounded-xl font-medium"><i class="fas fa-save mr-2"></i>${t("save")}</button>
                </div>
            </div>
        </div>`;
        document.body.appendChild(modal);
      }

      async function submitEditAdmin(adminId) {
        const name = document.getElementById("editAdminName").value.trim();
        const username = document
          .getElementById("editAdminUsername")
          .value.trim()
          .toLowerCase();
        const bkashEl = document.getElementById("editAdminBkash");
        const nagadEl = document.getElementById("editAdminNagad");
        const rocketEl = document.getElementById("editAdminRocket");
        const bkashNumber = bkashEl ? bkashEl.value.trim() : "";
        const nagadNumber = nagadEl ? nagadEl.value.trim() : "";
        const rocketNumber = rocketEl ? rocketEl.value.trim() : "";
        if (!name || !username) {
          showToast(t("fillAllFields"), "error");
          return;
        }
        if (!/^[A-Za-z0-9_]{3,30}$/.test(username)) {
          showToast("Username must be 3-30 chars: A-Z, 0-9, _ only", "error");
          return;
        }
        for (const p of [bkashNumber, nagadNumber, rocketNumber]) {
          if (p && !/^01[3-9]\d{8}$/.test(p)) {
            showToast(t("invalidPhone"), "error");
            return;
          }
        }
        const btn = document.getElementById("editAdminBtn");
        const original = btn.innerHTML;
        btn.innerHTML = `<span class="spinner mr-2"></span>...`;
        btn.disabled = true;
        const result = await apiCall("editAdmin", {
          adminId,
          name,
          username,
          bkashNumber,
          nagadNumber,
          rocketNumber,
        });
        btn.innerHTML = original;
        btn.disabled = false;
        if (result) {
          showToast(t("editAdminSuccess"), "success");
          closeModal("editAdminModal");
          await loadDashboardData();
          renderApp();
        }
      }

      /* ============================================================
       * TOGGLE ADMIN STATUS
       * ============================================================ */
      async function toggleAdminStatus(adminId) {
        let admin = null;
        for (let i = 0; i < State.admins.length; i++) {
          if (State.admins[i].Admin_ID === adminId) {
            admin = State.admins[i];
            break;
          }
        }
        if (!admin) return;
        const isActive = admin.Status === "Active";
        const confirmMsg =
          State.language === "bn"
            ? `আপনি কি "${admin.Name}" কে ${isActive ? "নিষ্ক্রিয়" : "সক্রিয়"} করতে চান?`
            : `Are you sure you want to ${isActive ? "deactivate" : "activate"} "${admin.Name}"?`;
        if (!confirm(confirmMsg)) return;
        const result = await apiCall("toggleAdminStatus", { adminId });
        if (result) {
          showToast(t("adminStatusChanged"), "success");
          await loadDashboardData();
          renderApp();
        }
      }

      /* ============================================================
       * STUDENTS TAB
       * ============================================================ */
      async function searchStudents() {
        var input = document.getElementById("studentSearch");
        if (!input) return;
        var admin = State.adminData || {};
        var isSuper = admin.Role === "SUPER_ADMIN";
        var batchEl = document.getElementById("studentBatchFilter");
        var batchValue = isSuper && batchEl ? batchEl.value : "all";
        var query = input.value.trim();
        if ((!query || query.length < 2) && batchValue === "all" && isSuper) {
          if (State.studentsSearchActive) {
            State.studentsSearchActive = false;
            State.studentsBatchFilter = "all";
            await loadDashboardData();
            renderApp();
          }
          return;
        }
        if ((!query || query.length < 2) && !isSuper) {
          await loadDashboardData();
          renderApp();
          return;
        }
        var result = await apiCall(
          "searchStudents",
          { query, batch: batchValue },
          { skipLoading: true },
        );
        if (result && result.students) {
          State.students = result.students;
          State.studentsSearchActive = true;
          State.studentsBatchFilter = batchValue;
          var tbody = document.querySelector("#studentsTableBody");
          if (tbody) tbody.innerHTML = renderStudentsTableBody(result.students);
          else renderApp();
          var totalEl = document.getElementById("studentsTotalDisplay");
          if (totalEl)
            totalEl.textContent =
              "Showing 1-" +
              Math.min(result.students.length, 100) +
              " of " +
              result.students.length;
          setTimeout(function () {
            var inp = document.getElementById("studentSearch");
            if (inp) {
              inp.focus();
              var len = inp.value.length;
              inp.setSelectionRange(len, len);
            }
          }, 10);
        }
      }

      var searchStudentsDebounced = debounce(searchStudents, 400);

      function onStudentBatchFilterChange() {
        searchStudents();
      }

      function renderStudentsTableBody(students) {
        const admin = State.adminData || {};
        const isSuper = admin.Role === "SUPER_ADMIN";
        const colCount = isSuper ? 7 : 6;
        if (!students || students.length === 0)
          return `<tr><td colspan="${colCount}" class="px-3 py-8 text-center text-gray-500"><p>${t("noStudents")}</p></td></tr>`;
        return students
          .slice(0, 100)
          .map(

      /* ============================================================

      function addNewStudentRow() {
        var batch = document.getElementById("addBatchSelect")
          ? document.getElementById("addBatchSelect").value
          : "";
        var previewId = batch ? previewStudentId(batch) : "PHS______";
        State.bulkStudents.push({
          studentId: "",
          studentIdPreview: previewId,
          roll: "",
          regNo: "",
          name: "",
          father: "",
          mother: "",
          dob: "",
          gender: "",
        });
        renderBulkStudentsTable();
      }

      function previewStudentId(batch) {
        var prefix = "PHS" + batch;
        var maxSerial = 0;
        (State.students || []).forEach(function (s) {
          var id = String(s.Student_ID || "").toUpperCase();
          var prefixUpper = prefix.toUpperCase();
          if (id.indexOf(prefixUpper) === 0) {
            var n = parseInt(
              id.substring(prefixUpper.length).replace(/[^\d]/g, ""),
              10,
            );
            if (!isNaN(n) && n > maxSerial) maxSerial = n;
          }
        });
        var pendingCount = (State.bulkStudents || []).length;
        return prefix + ("0000" + (maxSerial + pendingCount + 1)).slice(-4);
      }

      function renderBulkStudentsTable() {
        var tbody = document.getElementById("addStudentsRows");
        if (!tbody) return;
        if (State.bulkStudents.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-gray-500 text-xs">Click "+ Add Row" to start</td></tr>`;
          return;
        }
        tbody.innerHTML = State.bulkStudents
          .map(function (s, idx) {
            return `
    <tr class="border-b border-gray-100" data-row-idx="${idx}">
        <td class="px-1 py-1"><input type="text" class="bulk-input" value="${s.roll || ""}" maxlength="6" inputmode="numeric" placeholder="SSC Roll *" oninput="onBulkRollInput(${idx}, this)"></td>
        <td class="px-1 py-1"><input type="text" class="bulk-input" value="${s.regNo || ""}" maxlength="10" inputmode="numeric" placeholder="SSC Reg." oninput="updateBulkStudent(${idx}, 'regNo', this.value.replace(/\\D/g, '').slice(0, 10))"></td>
        <td class="px-1 py-1"><input type="text" class="bulk-input" value="${s.name || ""}" maxlength="150" placeholder="Student Name *" oninput="updateBulkStudent(${idx}, 'name', this.value); onNameInput(event)"></td>
        <td class="px-1 py-1"><input type="text" class="bulk-input" value="${s.father || ""}" maxlength="150" placeholder="Father Name *" oninput="updateBulkStudent(${idx}, 'father', this.value); onNameInput(event)"></td>
        <td class="px-1 py-1"><input type="text" class="bulk-input" value="${s.mother || ""}" maxlength="150" placeholder="Mother Name *" oninput="updateBulkStudent(${idx}, 'mother', this.value); onNameInput(event)"></td>
        <td class="px-1 py-1"><input type="date" class="bulk-input" value="${s.dob || ""}" onchange="updateBulkStudent(${idx}, 'dob', this.value)"></td>
        <td class="px-1 py-1"><select class="bulk-input" onchange="updateBulkStudent(${idx}, 'gender', this.value)"><option value="">Select</option><option value="Male" ${s.gender === "Male" ? "selected" : ""}>Male</option><option value="Female" ${s.gender === "Female" ? "selected" : ""}>Female</option><option value="Other" ${s.gender === "Other" ? "selected" : ""}>Other</option></select></td>
        <td class="px-1 py-1 text-center"><button onclick="removeBulkStudentRow(${idx})" class="w-7 h-7 bg-red-500 text-white rounded hover:bg-red-600" title="Remove"><i class="fas fa-times text-xs"></i></button></td>
    </tr>`;
          })
          .join("");
      }

      function updateBulkStudent(idx, field, value) {
        if (State.bulkStudents[idx]) State.bulkStudents[idx][field] = value;
      }

      function onBulkRollInput(idx, input) {
        var v = input.value.replace(/\D/g, "").slice(0, 6);
        input.value = v;
        if (State.bulkStudents[idx]) State.bulkStudents[idx].roll = v;
      }

      function removeBulkStudentRow(idx) {
        State.bulkStudents.splice(idx, 1);
        var batch = document.getElementById("addBatchSelect")
          ? document.getElementById("addBatchSelect").value
          : "";
        if (batch)
          State.bulkStudents.forEach(function (s) {
            s.studentIdPreview = previewStudentId(batch);
          });
        renderBulkStudentsTable();
      }

      function onBulkBatchChange() {
        if (State.bulkStudents.length > 0) {
          if (!confirm("Changing batch will clear all rows. Continue?")) return;
          State.bulkStudents = [];
        }
        renderBulkStudentsTable();
      }

      async function saveBulkStudents() {
        var batch = document.getElementById("addBatchSelect").value;
        if (!batch) {
          showToast("Please select a batch", "error");
          return;
        }
        if (State.bulkStudents.length === 0) {
          showToast("No rows to save", "error");
          return;
        }
        var errors = [];
        var seenRolls = {};
        State.bulkStudents.forEach(function (s, i) {
          var rowNum = i + 1;
          if (!s.roll) {
            errors.push("Row " + rowNum + ": SSC Roll is required");
            return;
          }
          if (!/^\d{1,6}$/.test(s.roll)) {
            errors.push("Row " + rowNum + ": Roll must be 1-6 digits");
            return;
          }
          if (seenRolls[s.roll]) {
            errors.push("Row " + rowNum + ": Duplicate roll " + s.roll);
            return;
          }
          seenRolls[s.roll] = rowNum;
          if (!s.name)
            errors.push("Row " + rowNum + ": Student Name is required");
          if (!s.father)
            errors.push("Row " + rowNum + ": Father Name is required");
          if (!s.mother)
            errors.push("Row " + rowNum + ": Mother Name is required");
          if (!s.dob) errors.push("Row " + rowNum + ": DOB is required");
          if (!s.gender) errors.push("Row " + rowNum + ": Gender is required");
          if (s.regNo && !/^(\d{6}|\d{10})$/.test(s.regNo))
            errors.push(
              "Row " + rowNum + ": SSC Registration must be 6 or 10 digits",
            );
        });
        if (errors.length > 0) {
          alert(
            "Please fix:\n\n" +
              errors.slice(0, 5).join("\n") +
              (errors.length > 5
                ? "\n... and " + (errors.length - 5) + " more"
                : ""),
          );
          return;
        }
        var btn = document.getElementById("saveBulkBtn");
        var original = btn.innerHTML;
        btn.innerHTML = `<span class="spinner mr-2"></span>Saving...`;
        btn.disabled = true;
        var result = await apiCall("addStudentsBulk", {
          batch,
          students: State.bulkStudents,
        });
        btn.innerHTML = original;
        btn.disabled = false;
        if (result) {
          showToast(result.count + " students added successfully", "success");
          State.bulkStudents = [];
          renderBulkStudentsTable();
          await loadDashboardData();
          renderApp();
        }
      }

      async function searchStudent() {
        const batch = document.getElementById("sscBatch").value;
        const roll = document.getElementById("sscRoll").value.trim();
        const registration = document
          .getElementById("sscRegistration")
          .value.trim();
        if (
          !batch ||
          !/^\d{4}$/.test(batch) ||
          !roll ||
          !/^\d{1,6}$/.test(roll)
        ) {
          showToast(t("fillAllFields"), "error");
          return;
        }
        const btn = document.getElementById("searchBtn");
        const original = btn.innerHTML;
        btn.innerHTML = `<span class="spinner mr-2"></span>${t("searching")}`;
        btn.disabled = true;
        const result = await apiCall(
          "searchStudent",
          { batch, roll, registration },
          { skipLoading: true },
        );
        btn.innerHTML = original;
        btn.disabled = false;
        if (result) {
          if (result.alreadyRegistered) {
            showToast(t("alreadyRegistered"), "warning");
            return;
          }
          if (result.alreadyRejected) {
            State.resubmitData = result.registration;
            const reg = result.registration;
            State.registrationData = {
              phone: normalizeClientPhone(reg.Phone || ""),
              email: reg.Email || "",
              bloodGroup: reg.Blood_Group || "",
              profession: reg.Profession || "",
              organizationName: reg.Organization_Name || "",
              jobPosition: reg.Job_Position || "",
              businessType: reg.Business_Type || "",
              otherDetails: "",
              profilePhotoUrl: reg.Profile_Photo_URL || "",
              participants: Number(reg.Participants) || 1,
              tshirtSize: reg.TShirt_Size || "",
              paymentMethod: "",
              payerPhone: "",
              transactionId: "",
              paymentNumber: null,
            };
            const batchNum = Number(String(reg.SSC_Batch).replace(/^'/, ""));
            let registrationFee = 600;
            if (batchNum === 2010) registrationFee = 1200;
            else if (batchNum <= 2016) registrationFee = 800;
            State.registrationData.registrationFee = registrationFee;
            State.registrationData.guestFee = 400;
            State.resubmitStep = "details";
            showToast(t("alreadyRejected"), "warning");
            setTimeout(() => navigateTo("resubmitRegistration"), 1000);
            return;
          }
          if (result.student) {
            State.studentData = result.student;
            State.currentStep = 2;
            renderApp();
          } else showToast(t("studentNotFound"), "error");
        }
      }

      function confirmStudent(isCorrect) {
        if (isCorrect) {
          const s = State.studentData;
          const batch = parseInt(String(s.SSC_Batch).replace(/^'/, ""));
          let registrationFee = 600;
          if (batch === 2010) registrationFee = 1200;
          else if (batch <= 2016) registrationFee = 800;
          State.registrationData = {
            registrationFee,
            guestFee: 400,
            participants: 1,
            tshirtSize: "",
            paymentNumber: null,
          };
          State.currentStep = 3;
        } else {
          State.studentData = null;
          State.currentStep = 1;
        }
        renderApp();
      }

      function onPhotoSelected(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          showToast(
            State.language === "bn"
              ? "ছবি ২ মেগাবাইটের বেশি হতে পারবে না"
              : "Photo must be under 2 MB",
            "error",
          );
          event.target.value = "";
          return;
        }
        if (!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type)) {
          showToast(
            State.language === "bn"
              ? "শুধু JPG, PNG বা WEBP ছবি গ্রহণযোগ্য"
              : "Only JPG, PNG or WEBP images allowed",
            "error",
          );
          event.target.value = "";
          return;
        }
        const previewDiv = document.getElementById("photoPreview");
        const previewImg = document.getElementById("photoPreviewImg");
        const statusEl = document.getElementById("photoStatus");

      function submitStep3() {
        const d = State.registrationData;
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const bloodGroup = document.getElementById("bloodGroup").value;
        const profession = d.profession || "";
        const participants = parseInt(
          document.getElementById("participants").value,
        );
        const tshirtSize = document.getElementById("tshirtSize").value;
        if (!phone || !email || !participants || !tshirtSize || !profession) {
          showToast(t("fillAllFields"), "error");
          return;
        }
        if (!/^01[3-9]\d{8}$/.test(phone)) {
          showToast(t("invalidPhone"), "error");
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showToast(t("invalidEmail"), "error");
          return;
        }
        if (
          !Number.isInteger(participants) ||
          participants < 1 ||
          participants > 10
        ) {
          showToast("Invalid participant count.", "error");
          return;
        }
        if (!CONFIG.TSHIRT_SIZES.includes(tshirtSize)) {
          showToast("Invalid T-Shirt size.", "error");
          return;
        }
        let organizationName = "",
          jobPosition = "",
          businessType = "",
          otherDetails = "";
        if (profession === "Job") {

            (document.getElementById("organizationName") &&
              document.getElementById("organizationName").value.trim()) ||
            "";
          jobPosition =
            (document.getElementById("jobPosition") &&
              document.getElementById("jobPosition").value.trim()) ||
            "";
          if (!organizationName) {
            showToast(t("organizationRequired"), "error");
            return;
          }
          if (!jobPosition) {
            showToast(t("jobPositionRequired"), "error");
            return;
          }
        } else if (profession === "Business") {
          businessType =
            (document.getElementById("businessType") &&
              document.getElementById("businessType").value.trim()) ||
            "";
          if (!businessType) {
            showToast(t("businessTypeRequired"), "error");
            return;
          }
        } else if (profession === "Others") {
          otherDetails =
            (document.getElementById("otherDetails") &&
              document.getElementById("otherDetails").value.trim()) ||
            "";
        }
        d.phone = phone;
        d.email = email;
        d.bloodGroup = bloodGroup;
        d.profession = profession;
        d.organizationName = organizationName;
        d.jobPosition = jobPosition;
        d.businessType = businessType;
        d.otherDetails = otherDetails;
        d.participants = participants;
        d.tshirtSize = tshirtSize;
        const guestCount = Math.max(0, d.participants - 1);
        d.totalAmount = d.registrationFee + guestCount * d.guestFee;
        State.currentStep = 4;
        renderApp();
      }

      async function selectPaymentMethod(method) {
        const d = State.registrationData;
        d.paymentMethod = method;
        const guestCount = Math.max(0, d.participants - 1);
        const baseTotal = d.registrationFee + guestCount * d.guestFee;
        d.paymentCharge = Math.ceil(
          baseTotal * (CONFIG.PAYMENT_CHARGES[method] || 0),
        );
        d.totalAmount = baseTotal + d.paymentCharge;
        d.paymentNumber = null;
        if (method === "cash") {
          d.payerPhone = d.phone || "";
          d.transactionId = "CASH";
        } else {
          d.payerPhone = d.payerPhone || "";
          d.transactionId = "";
        }
        if (State.studentData) {
          const batch = String(State.studentData.SSC_Batch).replace(/^'/, "");
          const result = await apiCall(
            "getPaymentNumber",
            { batch, method },
            { skipLoading: true },
          );
          if (result)
            d.paymentNumber = {
              method: method,
              number: result.number || "",
              adminAssigned: result.adminAssigned !== false,
              adminActive: result.adminActive !== false,
              adminName: result.adminName || "",
            };
          else
            d.paymentNumber = {
              method: method,
              number: "",
              adminAssigned: false,
              adminActive: false,
              adminName: "",
            };
        }
        renderApp();
      }

      function submitStep4() {
        const d = State.registrationData;
        if (d.paymentNumber) {
          if (d.paymentNumber.adminAssigned === false) {
            showToast(t("batchAdminNotAssigned"), "error");
            return;
          }
          if (d.paymentNumber.adminActive === false) {
            showToast(t("batchAdminInactive"), "error");
            return;
          }
        } else {
          showToast(t("batchAdminInactive"), "error");
          return;
        }
        const payerPhoneEl = document.getElementById("payerPhone");
        const transactionIdEl = document.getElementById("transactionId");
        const method = d.paymentMethod;
        if (!payerPhoneEl || !transactionIdEl) {
          showToast(t("selectPaymentMethod"), "error");
          return;
        }
        const payerPhone = payerPhoneEl.value.trim();
        const transactionId = transactionIdEl.value.trim().toUpperCase();
        if (!payerPhone || !transactionId) {
          showToast(t("fillAllFields"), "error");
          return;
        }
        if (!/^01[3-9]\d{8}$/.test(payerPhone)) {
          showToast(t("invalidPhone"), "error");
          return;
        }
        let valid = false,
          msg = "";
        if (method === "bkash") {
          valid = /^[A-Z0-9]{10}$/.test(transactionId);
          msg = "bKash TrxID must be 10 characters (A-Z, 0-9)";
        } else if (method === "nagad") {
          valid = /^[A-Z0-9]{8}$/.test(transactionId);
          msg = "Nagad TrxID must be 8 characters (A-Z, 0-9)";
        } else if (method === "rocket") {
          valid = /^[0-9]{10}$/.test(transactionId);
          msg = "Rocket TrxID must be 10 digits (0-9)";
        } else {
          valid = transactionId.length >= 2 && transactionId.length <= 100;
          msg = "Invalid transaction ID";
        }
        if (!valid) {
          showToast(msg, "error");
          return;
        }
        State.registrationData.payerPhone = payerPhone;
        State.registrationData.transactionId = transactionId;
        State.currentStep = 5;
        renderApp();
      }

      function renderPagination(currentPage, totalPages, fnName) {
        if (totalPages <= 1) return "";
        var buttons = [];
        buttons.push(
          `<button onclick="${fnName}(${currentPage - 1})" class="px-3 py-1 rounded-lg text-sm ${currentPage === 1 ? "bg-gray-100 text-gray-400 cursor-not-allowed" : "bg-gray-100 hover:bg-gray-200 text-gray-700"}" ${currentPage === 1 ? "disabled" : ""}><i class="fas fa-chevron-left"></i></button>`,
        );
        var pages = [];
        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, currentPage + 2);
        if (startPage > 1) {
          pages.push(1);
          if (startPage > 2) pages.push("...");
        }
        for (var i = startPage; i <= endPage; i++) pages.push(i);
        if (endPage < totalPages) {
          if (endPage < totalPages - 1) pages.push("...");
          pages.push(totalPages);
        }
        pages.forEach(function (p) {
          if (p === "...")
            buttons.push(`<span class="px-2 text-gray-400">...</span>`);
          else {
            var active = p === currentPage;
            buttons.push(
              `<button onclick="${fnName}(${p})" class="px-3 py-1 rounded-lg text-sm ${active ? "bg-purple-600 text-white font-bold" : "bg-gray-100 hover:bg-gray-200 text-gray-700"}">${p}</button>`,
            );
          }
        });
        buttons.push(
          `<button onclick="${fnName}(${currentPage + 1})" class="px-3 py-1 rounded-lg text-sm ${currentPage === totalPages ? "bg-gray-100 text-gray-400 cursor-not-allowed" : "bg-gray-100 hover:bg-gray-200 text-gray-700"}" ${currentPage === totalPages ? "disabled" : ""}><i class="fas fa-chevron-right"></i></button>`,
        );
        return `<div class="flex flex-wrap items-center justify-center gap-2 mt-4 pt-4 border-t border-gray-200">${buttons.join("")}</div>`;
      }

      async function printEntryPass() {
        const students = State.pageData.students || [];
        if (typeof QRCode === "undefined")
          showToast(
            State.language === "bn"
              ? "QR library লোড হয়নি — QR ছাড়াই প্রিন্ট হবে"
              : "QR library not loaded — printing without QR",
            "warning",
          );
        showLoading("Generating QR codes...");
        try {
          await generateQrCodesAsync(students);
          hideLoading();
          setTimeout(function () {
            window.print();
          }, 400);
        } catch (e) {
          hideLoading();
          console.error("QR generation failed:", e);
          window.print();
        }
      }

      // Generate QR codes for all students (Promise)
      function generateQrCodesAsync(students) {
        return new Promise(function (resolve) {
          if (typeof QRCode === "undefined") {
            console.error("QR library not loaded");
            resolve();
            return;
          }
          if (!students || students.length === 0) {
            resolve();
            return;
          }
          var pending = students.length;
          var done = function () {
            pending--;
            if (pending === 0) resolve();
          };
          students.forEach(function (s) {
            var safeRegId = String(s.Registration_ID || "").replace(
              /[^A-Z0-9]/g,
              "_",
            );
            var el = document.getElementById("qr_" + safeRegId);
            if (!el) {
              done();
              return;
            }
            el.innerHTML = "";
            var canvas = document.createElement("canvas");
            el.appendChild(canvas);
            var qrData =
              window.location.origin +
              window.location.pathname +
              "?verify=" +
              encodeURIComponent(s.Registration_ID || "");
            QRCode.toCanvas(
              canvas,
              qrData,
              {
                width: 400,
                margin: 1,
                color: { dark: "#000000", light: "#ffffff" },
                errorCorrectionLevel: "H",
              },
              function (err) {
                if (err) console.error("QR error for " + safeRegId + ":", err);
                done();
              },
            );
          });
        });
      }

        if (!batch) {
          showToast("Please select a batch", "error");
          return;
        }
        if (!selectedExcelData) {
          showToast(t("invalidExcelFile"), "error");
          return;
        }
        const btn = document.getElementById("importBtn");
        const original = btn.innerHTML;
        btn.innerHTML = `<span class="spinner mr-2"></span>Importing...`;
        btn.disabled = true;
        try {
          const base64 = await fileToBase64(selectedExcelData);
          const result = await apiCall(
            "importStudentsFromExcel",
            {
              batch,
              fileBase64: base64,
              fileName: selectedExcelData.name,
              mimeType:
                selectedExcelData.type ||
                "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            },
            { skipLoading: true },
          );
          btn.innerHTML = original;
          btn.disabled = false;
          clearExcelFileInput();
          if (result) {
            const imported = result.count || 0;
            const skipped = result.skipped || 0;
            const errors = result.errors || [];
            let html = "";
            if (skipped === 0)
              html = `<div class="bg-green-50 border-2 border-green-300 rounded-lg p-4 mt-3"><div class="flex items-center gap-2 mb-2"><i class="fas fa-check-circle text-green-600 text-2xl"></i><p class="text-lg text-green-800 font-bold">Import Complete</p></div><p class="text-sm text-green-700"><b>${imported}</b> students imported successfully</p></div>`;
            else
              html = `<div class="bg-yellow-50 border-2 border-yellow-300 rounded-lg p-4 mt-3"><p class="text-lg text-yellow-800 font-bold">Import Complete (Partial)</p><p class="text-sm text-yellow-800 mb-2"><b>${imported}</b> imported, <b>${skipped}</b> skipped</p>${
                errors.length > 0
                  ? `<div class="text-xs text-red-700 bg-white border border-red-200 rounded p-2 max-h-40 overflow-y-auto"><p class="font-medium mb-1">Errors:</p><ul class="list-disc pl-4">${errors
                      .slice(0, 20)
                      .map((e) => `<li>${e}</li>`)
                      .join("")}</ul></div>`
                  : ""
              }</div>`;
            const div = document.getElementById("importResult");
            div.innerHTML = html;
            div.classList.remove("hidden");
            showToast(`${imported} students imported`, "success");
            await loadDashboardData();
          }
        } catch (e) {
          btn.innerHTML = original;
          btn.disabled = false;
          clearExcelFileInput();
          const div = document.getElementById("importResult");
          div.innerHTML = `<div class="bg-red-50 border-2 border-red-300 rounded-lg p-4 mt-3"><p class="text-red-800 font-bold">Import Failed</p><p class="text-sm text-red-700">${e.message || "Unknown error"}</p></div>`;
          div.classList.remove("hidden");
        }
      }

      function clearExcelFileInput() {
        const fileInput = document.getElementById("excelFile");
        if (fileInput) fileInput.value = "";
        selectedExcelData = null;
        const preview = document.getElementById("excelPreview");
        if (preview) preview.classList.add("hidden");
        const fileNameEl = document.getElementById("excelFileName");
        if (fileNameEl) fileNameEl.textContent = "";
      }

      async function saveSettings() {
        const startHour = document.getElementById("settingStartHour").value;
        const startMin = document.getElementById("settingStartMinute").value;
        const startAmPm = document.getElementById("settingStartAmPm").value;
        const endHour = document.getElementById("settingEndHour").value;
        const endMin = document.getElementById("settingEndMinute").value;
        const endAmPm = document.getElementById("settingEndAmPm").value;
        const data = {
          Event_Name: document.getElementById("settingEventName").value.trim(),
          Event_Date: document.getElementById("settingEventDate").value,
          Venue: document.getElementById("settingVenue").value.trim(),
          Registration_Deadline:
            document.getElementById("settingDeadline").value,
          Registration_Open: document
            .getElementById("settingRegistrationOpen")
            .value.toLowerCase(),
          Contact_Number: document
            .getElementById("settingContactNumber")
            .value.trim(),
          Contact_Email: document
            .getElementById("settingContactEmail")
            .value.trim(),
          Event_Start_Time: startHour + ":" + startMin + " " + startAmPm,
          Event_End_Time: endHour + ":" + endMin + " " + endAmPm,
        };
        const result = await apiCall("saveSettings", data);
        if (result) {
          showToast("Settings saved successfully", "success");
          try {
            localStorage.removeItem("phs_settings_cache");
            localStorage.removeItem("phs_settings_cache_time");
          } catch (e) {}
          await loadDashboardData();
          renderApp();
        }
      }

      /* ============================================================
       * HOME COUNTDOWN TIMERS
       * ============================================================ */
      let _homeCountdownInterval = null;
      let _deadlineCountdownInterval = null;

      function startHomeCountdown(targetTimestamp, deadlineTimestamp) {
        if (_homeCountdownInterval) clearInterval(_homeCountdownInterval);

        const eventTarget = Number(targetTimestamp);
        const deadlineTarget = Number(deadlineTimestamp);

        if (!eventTarget || isNaN(eventTarget)) return;

        function updateTimers() {
          // Event countdown
          const elDays = document.getElementById("hcDays");
          if (elDays) {
            const diff = eventTarget - Date.now();
            if (diff <= 0) {
              elDays.textContent = "0";
              document.getElementById("hcHours").textContent = "0";
              document.getElementById("hcMins").textContent = "0";
              document.getElementById("hcSecs").textContent = "0";
            } else {
              const days = Math.floor(diff / (1000 * 60 * 60 * 24));
              const hours = Math.floor(
                (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
              );
              const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
              const secs = Math.floor((diff % (1000 * 60)) / 1000);
              elDays.textContent = formatNumber(String(days));
              document.getElementById("hcHours").textContent = formatNumber(
                String(hours).padStart(2, "0"),
              );
              document.getElementById("hcMins").textContent = formatNumber(
                String(mins).padStart(2, "0"),
              );
              document.getElementById("hcSecs").textContent = formatNumber(
                String(secs).padStart(2, "0"),
              );
            }
          }

          // Deadline countdown
          const dlDays = document.getElementById("dlDays");
          if (dlDays && deadlineTarget && !isNaN(deadlineTarget)) {
            const dlDiff = deadlineTarget - Date.now();
            if (dlDiff <= 0) {
              dlDays.textContent = "0";
              document.getElementById("dlHours").textContent = "0";
              document.getElementById("dlMins").textContent = "0";
              document.getElementById("dlSecs").textContent = "0";
            } else {
              const dD = Math.floor(dlDiff / (1000 * 60 * 60 * 24));
              const dH = Math.floor(
                (dlDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
              );
              const dM = Math.floor((dlDiff % (1000 * 60 * 60)) / (1000 * 60));
              const dS = Math.floor((dlDiff % (1000 * 60)) / 1000);
              dlDays.textContent = formatNumber(String(dD));
              document.getElementById("dlHours").textContent = formatNumber(
                String(dH).padStart(2, "0"),
              );
              document.getElementById("dlMins").textContent = formatNumber(
                String(dM).padStart(2, "0"),
              );
              document.getElementById("dlSecs").textContent = formatNumber(
                String(dS).padStart(2, "0"),
              );
            }
          }

          // Stop if elements gone
          if (!elDays && !dlDays) {
            clearInterval(_homeCountdownInterval);
            _homeCountdownInterval = null;
          }
        }

        updateTimers();
        _homeCountdownInterval = setInterval(updateTimers, 1000);
      }

      /* ============================================================
       * EVENT LISTENERS
       * ============================================================ */
      let listenersAttached = false;
      function attachEventListeners() {
        if (listenersAttached) return;
        listenersAttached = true;
        document.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && e.target.tagName === "INPUT") {
            const id = e.target.id;
            if (
              id === "searchQuery" ||
              id === "sscRoll" ||
              id === "sscRegistration" ||
              id === "regSearch" ||
              id === "studentSearch" ||
              id === "manualRegId"
            )
              return;
            e.preventDefault();
            const form = e.target.closest(".card");
            if (form) {
              const btn = form.querySelector(".btn-primary");
              if (btn) btn.click();
            }
          }
        });
      }

      /* ============================================================
       * INIT
       * ============================================================ */
      document.addEventListener("DOMContentLoaded", async () => {
        // Load jsQR for camera scanning
        try {
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
          document.head.appendChild(script);
        } catch (e) {}

        // Load public settings (cached 5 min)
        try {
          const cacheKey = "phs_settings_cache";
          const cacheTimeKey = "phs_settings_cache_time";
          const cachedTime = Number(localStorage.getItem(cacheTimeKey) || 0);
          const now = Date.now();
          let settings = null;
          if (now - cachedTime < 5 * 60 * 1000) {
            try {
              settings = JSON.parse(localStorage.getItem(cacheKey));
            } catch (e) {}
          }
          if (!settings) {
            settings = await apiCall("getPublicSettings");
            if (settings) {
              localStorage.setItem(cacheKey, JSON.stringify(settings));
              localStorage.setItem(cacheTimeKey, String(now));
            }
          }
          if (settings) State.settings = settings;
        } catch (e) {}

        // Verify-ID mode (from QR link)
        if (VERIFY_ID) {
          State.currentPage = "checkStatus";
          renderApp();
          setTimeout(async function () {
            try {
              const input = document.getElementById("searchQuery");
              if (input) {
                input.value = VERIFY_ID;
                await searchRegistration();
              }
            } catch (err) {
              console.error("Verification URL error:", err);
            }
          }, 300);
          return;
        }

        // Return to check-status after registration success
        if (sessionStorage.getItem("returnToCheckStatus") === "true") {
          sessionStorage.removeItem("returnToCheckStatus");
          State.currentPage = "checkStatus";
          renderApp();
          return;
        }

        // Validate existing session
        if (State.session) {
          const result = await apiCall(
            "verifySession",
            {},
            { skipLoading: true },
          );
          if (result && result.admin) {
            State.adminData = result.admin;
            if (result.admin.Role === "GATE_ADMIN") {
              await loadGateDashboard();
              State.gateTab = "scanner";
              navigateTo("gateDashboard");
            } else {
              await loadDashboardData();
              navigateTo("dashboard");
            }
            return;
          } else {
            State.session = null;
            localStorage.removeItem("phs_session");
          }
        }
        navigateTo("home");
      });
    </script>
  </body>
</html>
